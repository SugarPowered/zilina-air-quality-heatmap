# Publishes the heatmap/ folder (index.html + data.js) to GitHub Pages on every push to main.
# Requires Settings -> Pages -> Source: "GitHub Actions". Manual run: Actions -> this workflow -> Run workflow.
# Also called by update-data.yml after it commits new data (pushes made by GITHUB_TOKEN don't trigger workflows).
name: Deploy heatmap to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["heatmap/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # latest main, incl. a data commit made by the caller
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: heatmap
      - id: deployment
        uses: actions/deploy-pages@v4
