# Daily: fetch new hourly measurements from the Žilina Open Data API, rebuild the map data,
# commit them to main and redeploy GitHub Pages. If the API is down, the run ends quietly as
# successful with a notice, and nothing is committed (the map keeps the last available data).
# Any other error (bug, broken data) still fails the run.
name: Update recent data

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC daily (06:15/07:15 in Žilina)
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch new measurements
        id: fetch
        run: |
          set +e
          python scripts/prepare_data.py --update
          code=$?
          if [ "$code" -eq 75 ]; then   # EXIT_API_UNAVAILABLE in prepare_data.py
            echo "::notice::Open Data API is unavailable, update skipped. The map keeps the last available data."
            echo "api=down" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      - name: Rebuild heatmap data
        if: steps.fetch.outputs.api != 'down'
        run: python scripts/build_heatmap.py
      - name: Commit if data changed
        id: commit
        if: steps.fetch.outputs.api != 'down'
        run: |
          if git diff --quiet -- data/pm_hourly.csv.gz; then
            echo "No new measurements."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data heatmap/data.js
          git commit -m "Update air-quality data to $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
